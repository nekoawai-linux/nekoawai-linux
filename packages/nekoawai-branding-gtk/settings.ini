#
# System-wide defaults for GTK applications.
#
# NekoAwai is written in a near-black room with a hint of violet, and a light
# desktop standing in front of that background reads as a mistake rather than
# a choice. The dark variant of Adwaita is that choice, made once here.
#
# The icon and cursor themes stay Adwaita. Half a borrowed icon set replaced
# by hand is worse than the whole of it, and NekoAwai has drawn neither yet.
#
# Overridden per user in ~/.config/gtk-3.0/settings.ini. Inside an Xfce
# session xfsettingsd has the last word instead; that copy of the decision
# lives in nekoawai-branding-xfce.
#

[Settings]
gtk-theme-name = Adwaita-dark
gtk-application-prefer-dark-theme = true
gtk-cursor-theme-name = Adwaita
gtk-icon-theme-name = Adwaita
gtk-fallback-icon-theme = Adwaita
gtk-enable-primary-paste = true
