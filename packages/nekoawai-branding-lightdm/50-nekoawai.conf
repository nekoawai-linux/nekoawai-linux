#
# The screen NekoAwai shows before anyone has logged in: the same room the
# session is in, with the NekoAwai background and dark Adwaita over it, and
# no picture of a distribution anywhere. What is asking to be acted on is the
# password field, and the greeter draws that one in colour by itself.
#
# A drop-in rather than a replacement of lightdm-gtk-greeter.conf. The
# greeter has read this directory since 2.0.1, and the file it belongs to
# stays where the greeter's own package put it, commented out and complete.
#

[greeter]
background=/usr/share/wallpapers/NekoAwai/contents/images/default.png
theme-name=Adwaita-dark
icon-theme-name=Adwaita
cursor-theme-name=Adwaita
xft-antialias=true
xft-hintstyle=hintslight
indicators=~host;~spacer;~clock;~spacer;~language;~layout;~session;~a11y;~power;
