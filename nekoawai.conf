# Build identity. Read by scripts/; the version reaches spec files through
# --define nekoawai_version, the rest through rpmbuild macros. Values the
# installed system sees (URL, CPE, descriptions) live in the specs that own
# them.

NEKO_NAME="NekoAwai"
NEKO_ID=nekoawai
NEKO_VERSION=0.0.2
NEKO_VENDOR=NekoAwai
NEKO_DISTTAG=.na1
NEKO_ARCH=x86_64

# Upstream of the binary base. Once packages are rebuilt in-house, these two
# lines are the only ones that change.
NEKO_UPSTREAM_OSS=http://download.opensuse.org/tumbleweed/repo/oss/
NEKO_UPSTREAM_NON_OSS=http://download.opensuse.org/tumbleweed/repo/non-oss/
