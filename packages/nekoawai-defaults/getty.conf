[Service]
# systemd runs agetty with --noclear to keep the boot log on screen. The
# welcome screen is then printed under that log, and printed again whenever
# agetty reloads /etc/issue - which it does as soon as DHCP replaces the
# loopback address. Clearing first leaves one screen instead of three.
ExecStart=
ExecStart=-/usr/sbin/agetty --noreset - $TERM
