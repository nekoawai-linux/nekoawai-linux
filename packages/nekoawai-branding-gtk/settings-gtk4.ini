#
# System-wide defaults for GTK 4 applications.
#
# There is no Adwaita-dark to name here: GTK 4 carries one Adwaita and asks
# for the dark variant by preference rather than by theme name, and a
# libadwaita application ignores both and follows the colour scheme (see the
# gsettings override in this package).
#
# Overridden per user in ~/.config/gtk-4.0/settings.ini.
#

[Settings]
gtk-theme-name = Adwaita
gtk-application-prefer-dark-theme = true
gtk-cursor-theme-name = Adwaita
gtk-icon-theme-name = Adwaita
gtk-enable-primary-paste = true
