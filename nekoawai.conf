# Build identity. Read by scripts/; the version reaches spec files through
# --define nekoawai_version, the rest through rpmbuild macros. Values the
# installed system sees (URL, CPE, descriptions) live in the specs that own
# them.

NEKO_NAME="NekoAwai"
NEKO_ID=nekoawai
NEKO_VERSION=0.0.3
NEKO_VENDOR=NekoAwai
NEKO_DISTTAG=.na1
NEKO_ARCH=x86_64

# Upstream of the binary base. Once packages are rebuilt in-house, these two
# lines are the only ones that change.
#
# https rather than http: a signature is only worth the key it is checked
# against, and over plain http the redirect to a mirror, the metadata and the
# key offered alongside them all come from whoever is carrying the packets.
NEKO_UPSTREAM_OSS=https://download.opensuse.org/tumbleweed/repo/oss/
NEKO_UPSTREAM_NON_OSS=https://download.opensuse.org/tumbleweed/repo/non-oss/

# The GPG key the distribution's own packages are signed with, as gpg names
# it: a key id, a fingerprint or a uid. Empty means unsigned, which is where
# 0.0.3 stands -- see packages/nekoawai-keyring/README.md. When it is set,
# scripts/build-packages.sh signs every rpm and scripts/make-repo.sh signs the
# repository metadata, and nothing else has to change.
NEKO_SIGN_KEY=${NEKO_SIGN_KEY:-}
